# configs/model/pix2pix.yaml

_target_: dlp_ml.models.pix2pix_wrapper.Pix2PixModel

generator:
  _target_: dlp_ml.models.unet.UNet
  in_channels: 1
  out_channels: 1
  base: 64
  bilinear: true

discriminator:
  _target_: dlp_ml.models.pix2pix.PatchDiscriminator
  in_channels: 2
  base: 64
  n_layers: 3
