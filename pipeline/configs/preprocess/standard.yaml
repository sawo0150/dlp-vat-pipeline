# configs/preprocess/standard.yaml
name: standard

io:
  # pairing 폴더를 입력으로 사용
  input_from: pairing
  # processed 결과 루트 (DatasetManager가 ds.dirs["processed"]로 이미 만들어둠)
  processed_subdir: ""   # 보통 빈 문자열(= interim/processed 바로 사용)

mask:
  pad_total: 32          # 총 패딩(128 -> 160)
  pad_each: 16           # 자동 계산해도 되지만 명시
  size_128: 128
  size_160: 160
  upsample_factor: 8     # 160*8=1280
  size_1280: 1280
  interp: nearest        # mask는 nearest 고정 추천

ld:
  transpose: true        # MATLAB 로직 반영
  size_raw: 1600
  crop_size: 1280
  warp_interp: linear
  border_value: 0

registration:
  # 수동으로 찾은 값을 YAML에 박아 넣을 수도 있고,
  # interim/processed/registration_params_{mode}.json을 읽어올 수도 있음
  source: yaml           # yaml | file
  file_pattern: "interim/processed/registration_params_{mode}.json"
  params:
    binary:
      angle: 1.15
      scale: 0.8031
      tx: 56.0
      ty: 11.0
    gray:
      angle: 1.15
      scale: 0.8031
      tx: 56.0
      ty: 11.0

threshold:
  enable: true
  fixed:
    enable: false
    values: [30]         # 예: T30만 저장. 여러 개도 가능 [20, 30, 40]
    prefix: "T"
  random:
    enable: true
    num: 2
    low: 50
    high: 80
    seed: 1234

output:
  save_raw_ld_copy: false     # true면 *_ld_1600_raw에도 저장(복사/링크)
  raw_ld_copy_mode: "symlink" # copy | hardlink | symlink
  image_ext: ".png"

qc:
  enable: true
  # QC는 'fixed threshold' 기준으로 IoU/Dice 계산(여러 threshold면 여러 컬럼 생성)
  metrics: ["iou", "dice", "ncc"]
