# configs/generator/b1_shape.yaml
defaults:
  - /generator/mix_imagenet # 기본 설정을 상속받음 (필요한 것만 덮어쓰기)

mix:
  num_layers: [1, 1]      # 한 장에 레이어 1개만
  layer_probs:
    shape: 1.0            # Shape 100%
    grid: 0.0
    stripe: 0.0
    imagenet: 0.0

shapes:
  types: ["circle", "rect", "triangle", "parallelogram", "polygon", "ellipse", "arc"]
  num_shapes: [5, 15]     # 도형 개수 좀 더 많게
  cutout_prob: 0.40       # Cutout 확률 대폭 증가 (기존 0.15 -> 0.5)
  fill_prob: 0.9          # 채운 도형 위주
  thickness: [2, 4]
  size: [16, 32]           # 크기 다양하게
  poly_vertices: [4, 6]
  rotate:
    # shape 레이어를 통째로 회전시키는 옵션
    # - 도형이 주로 axis-aligned로 나오는 문제를 완화
    enable: true
    prob: 0.35          # 회전 적용 확률
    angle: [-25, 25]    # 회전 각도 범위(deg)
  speckle:
    enable: true
    prob: 0.35              # shape layer 생성 후 speckle 적용 확률
    band_width: [1, 3]      # 경계 band 두께(픽셀). 커질수록 경계 주변 선택 영역이 넓어짐

    # a,b 후보 (a×b 패치 크기). 요청대로 1,2,3 중 선택
    patch_sizes: [1, 2, 3]
    swap_prob: 0.5          # a×b vs b×a 랜덤 스왑 확률 (방향 다양화)

    # 몇 개의 패치를 찍을지
    # - 너무 크면 경계가 과하게 두꺼워질 수 있음
    num_patches: [50, 100]

    # [신규] speckle patch 내부를 "흰/검 랜덤 binary"로 만들기 위한 설정
    # - fill_prob: 패치 내부에서 255가 될 확률 (나머지는 0)
    fill_prob: [0.5, 0.5]     # 패치마다 랜덤으로 뽑아 다양화
    # - optional: 패치 내부에 공간 상관성을 주고 싶으면 blur/threshold 같은 걸 넣을 수도 있는데,
    #   지금은 단순 Bernoulli noise로 충분히 speckle 느낌 남

    # [신규] 패치 적용 방식
    # - overwrite: 패치 내부를 micro-binary로 덮어쓰기 (0/255 섞임)
    # - xor: 기존 mask를 패치 내부에서 토글 (0<->255)
    # - mix: overwrite/xor를 섞음
    mode: "mix"
    mix_prob: 0.6              # mode==mix일 때 overwrite 선택 확률 (나머지는 xor)

    # [신규] 경계에 최대한 "붙게" 하는 옵션
    # anchor를 band가 아니라 "edge pixel"에서 직접 뽑도록(더 붙음)
    anchor: "edge"             # ["edge", "band"] (현재 코드는 edge 우선)
    anchor_jitter: 0.0         # anchor 좌표에 ±jitter 픽셀 (0이면 완전 밀착)


post:
  invert_prob: 0.00
  morph:
    enable_prob: 0.00
    op: ["open", "close", "erode", "dilate"]
    ksize: [1, 5]
    iters: [1, 2]
  filter:
    enable: true
    min_white_ratio: 0.10
    max_white_ratio: 0.50
    max_retries: 50