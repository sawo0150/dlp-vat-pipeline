[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-vat-pipeline"
version = "0.1.0"
description = "DLP vat photopolymerization data processing pipeline"
requires-python = ">=3.10"
dependencies = [
  "hydra-core",
  "omegaconf",
  "numpy",
  "pandas",
  "pillow",
  "tqdm",
  "pyyaml",
  "opencv-python",
  "scikit-image",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
