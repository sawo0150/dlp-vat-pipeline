task:
  _target_: dlp_ml.tasks.inverse.InverseTask
model:
  _target_: dlp_ml.models.unet.UNet
  in_channels: 1
  out_channels: 1
  base: 64
  bilinear: true
data:
  manifest_path: ${hydra:runtime.cwd}/../example_manifest.jsonl
  base_dir: null
  input_key: input_path
  target_key: target_path
  input_mode: L
  target_mode: L
  normalize: true
  batch_size: 8
  num_workers: 4
  val_ratio: 0.1
  group_split: true
loss:
  name: l1
  weight: 1.0
trainer:
  use_cuda: true
  lr: 0.001
  weight_decay: 0.0
  max_epochs: 20
  log_every: 50
  grad_clip: 0.0
  amp: true
logger:
  name: wandb
  project: dlp-vat
  entity: null
  run_name: null
  tags: []
  mode: online
seed: 42
