[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-vat-common"
version = "0.1.0"
description = "Common utilities and dataset schema for DLP vat pipeline + ML"
requires-python = ">=3.10"
dependencies = ["pydantic", "pyyaml", "pandas"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
